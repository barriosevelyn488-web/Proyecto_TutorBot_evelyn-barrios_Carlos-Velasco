<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Académico</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { 
            background-color: #0f172a; 
            color: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        
        .form-container { 
            background-color: #1e293b; 
            padding: 40px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
        }
        
        h2 { margin-bottom: 24px; color: #f8fafc; font-size: 24px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; font-weight: 500; }
        
        input, select { 
            width: 100%;
            padding: 12px 16px; 
            background-color: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            color: #ffffff; 
            font-size: 16px;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .btn-submit { 
            background-color: #8b5cf6; 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        
        .btn-submit:hover { background-color: #7c3aed; }
        .btn-submit:disabled { background-color: #475569; cursor: not-allowed; }
        
        .status-message { display: none; padding: 12px; border-radius: 8px; margin-top: 20px; font-size: 14px; text-align: center; }
        .success { background-color: #064e3b; border: 1px solid #059669; color: #a7f3d0; display: block; }
        .error { background-color: #7f1d1d; border: 1px solid #dc2626; color: #fecaca; display: block; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Registro Académico</h2>
        <form id="form-registro">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" name="nombres" required placeholder="Tu nombre y apellido">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label>Carrera</label>
                <select name="carrera" required>
                    <option value="" disabled selected>Selecciona tu carrera...</option>
                    <option value="Ingenieria Sistemas">Ingeniería en Sistemas</option>
                    <option value="Ciencia Datos">Ciencia de Datos</option>
                    <option value="Ciberseguridad">Ciberseguridad</option>
                    <option value="Desarrollo Software">Desarrollo de Software</option>
                    <option value="Redes Telecom">Redes y Telecomunicaciones</option>
                </select>
            </div>
            
            <input type="hidden" name="tipo" value="registro">
            <input type="hidden" name="chatId" id="chatId">
            
            <button type="submit" class="btn-submit">Enviar Registro</button>
            <div class="status-message" id="msg-status"></div>
        </form>
    </div>

    <script>
        // Obtener chatId de la URL
        const params = new URLSearchParams(window.location.search);
        document.getElementById('chatId').value = params.get('chatId') || '';

        const form = document.getElementById('form-registro');
        const msgDiv = document.getElementById('msg-status');
        const btn = form.querySelector('button');

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            btn.innerText = "Enviando...";
            btn.disabled = true;

            try {
                const formData = new FormData(form);
                const response = await fetch('https://gradient-subsidize-unflawed.ngrok-free.dev/webhook-test/2175dafb-0902-4ca2-b118-4e5bc913ce4d', { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (response.ok) {
                    msgDiv.className = 'status-message success';
                    msgDiv.innerHTML = "<strong>¡Éxito!</strong> Tu información ha sido registrada.";
                    form.reset();
                } else {
                    throw new Error('Error en el servidor');
                }
            } catch(err) {
                msgDiv.className = 'status-message error';
                msgDiv.innerHTML = "<strong>Error.</strong> Intenta de nuevo más tarde.";
            } finally {
                btn.innerText = "Enviar Registro";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
