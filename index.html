<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Académica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .main-menu { margin-top: 50px; margin-bottom: 30px; }
        .btn-menu { background-color: #bb86fc; border: none; padding: 15px 30px; margin: 0 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Estructura Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal.activo { display: flex; opacity: 1; }
        .form-container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { margin-bottom: 8px; color: #b3b3b3; font-size: 14px; }
        input, select { padding: 12px; background-color: #2c2c2c; border: 1px solid #444; border-radius: 6px; color: #ffffff; }
        .btn-submit { background-color: #bb86fc; color: #000; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        
        /* Tus estilos originales de mensajes */
        .status-message { display: none; padding: 15px; border-radius: 6px; margin-top: 20px; font-size: 14px; text-align: center; }
        .success { background-color: #1b3a2a; border: 1px solid #34a853; color: #81c995; display: block; }
        .error { background-color: #4a1f1f; border: 1px solid #ea4335; color: #f28b82; display: block; }
    </style>
</head>
<body>

    <div class="main-menu">
        <button class="btn-menu" onclick="abrirModal('registro')">Registrarse</button>
        <button class="btn-menu" onclick="abrirModal('matricula')">Matricularse</button>
    </div>

    <div id="modal-registro" class="modal" onclick="cerrarSiFondo(event)">
        <div class="form-container" onclick="event.stopPropagation()">
            <h2>Registro Académico</h2>
            <form id="form-registro">
                <div class="form-group"><label>Nombre Completo</label><input type="text" name="nombres" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
                <div class="form-group"><label>Carrera</label>
                    <select name="carrera" required>
                        <option value="" disabled selected>Elige una opción...</option>
                        <option value="Ingenieria Sistemas">Ingeniería en Sistemas</option>
                        <option value="Ciencia Datos">Ciencia de Datos</option>
                        <option value="Ciberseguridad">Ciberseguridad</option>
                        <option value="Desarrollo Software">Desarrollo de Software</option>
                        <option value="Redes Telecom">Redes y Telecomunicaciones</option>
                    </select>
                </div>
                <input type="hidden" name="tipo" value="registro">
                <input type="hidden" name="chatId" id="chatId-reg">
                <button type="submit" class="btn-submit">Enviar Solicitud</button>
                <div class="status-message" id="msg-registro"></div>
            </form>
        </div>
    </div>

    <div id="modal-matricula" class="modal" onclick="cerrarSiFondo(event)">
        <div class="form-container" onclick="event.stopPropagation()">
            <h2>Formulario de Matrícula</h2>
            <form id="form-matricula">
                <div class="form-group"><label>Código de Estudiante</label><input type="text" name="estudiante_id" required></div>
                <div class="form-group"><label>ID de Materia</label><input type="text" name="materia_id" required></div>
                <div class="form-group"><label>ID de Tutor</label><input type="text" name="tutor_id" required></div>
                <input type="hidden" name="tipo" value="matricula">
                <input type="hidden" name="chatId" id="chatId-mat">
                <button type="submit" class="btn-submit">Confirmar Matrícula</button>
                <div class="status-message" id="msg-matricula"></div>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chatId') || '';
        document.getElementById('chatId-reg').value = chatId;
        document.getElementById('chatId-mat').value = chatId;

        function abrirModal(tipo) {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('activo'));
            document.getElementById('modal-' + tipo).classList.add('activo');
        }

        function cerrarSiFondo(e) { if(e.target.classList.contains('modal')) e.target.classList.remove('activo'); }

        document.querySelectorAll('form').forEach(form => {
            form.onsubmit = async (e) => {
                e.preventDefault();
                const msgDiv = e.target.querySelector('.status-message');
                const btn = e.target.querySelector('button');
                
                btn.innerText = "Enviando...";
                btn.disabled = true;

                try {
                    const formData = new FormData(e.target);
                    await fetch('https://gradient-subsidize-unflawed.ngrok-free.dev/webhook-test/2175dafb-0902-4ca2-b118-4e5bc913ce4d', { method: 'POST', body: formData });
                    
                    msgDiv.className = 'status-message success';
                    msgDiv.innerHTML = "<strong>¡Éxito!</strong> Tu información ha sido enviada.";
                    e.target.reset();
                } catch(err) {
                    msgDiv.className = 'status-message error';
                    msgDiv.innerHTML = "<strong>Error.</strong> Intenta de nuevo más tarde.";
                }
                btn.innerText = "Enviar Solicitud";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
