<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Solicitud</title>
    <style>
        /* Configuración de tonos oscuros */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212; /* Fondo oscuro */
            color: #e0e0e0; /* Texto claro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #1e1e1e; /* Contenedor un poco más claro */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
        }

        .form-container h2 {
            margin-bottom: 25px;
            color: #ffffff;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #b3b3b3;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #bb86fc; /* Acento púrpura suave */
        }

        .btn-submit {
            background-color: #bb86fc;
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #9965f4;
        }

        /* Estilos de respuesta */
        .status-message {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
        }

        .success { background-color: #1b3a2a; border: 1px solid #34a853; color: #81c995; }
        .error { background-color: #4a1f1f; border: 1px solid #ea4335; color: #f28b82; }

        #exito:target, #error:target { display: block; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Registro Académico</h2>
        
        <form action="#" method="POST" id="myForm">
            <div class="form-group">
                <label for="nombres">Nombre Completo</label>
                <input type="text" id="nombres" name="nombres" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="carrera">Selecciona una Carrera</label>
                <select id="carrera" name="carrera" required>
                    <option value="" disabled selected>Elige una opción...</option>
                    <option value="Ingenieria Sistemas">Ingeniería en Sistemas</option>
                    <option value="Ciencia Datos">Ciencia de Datos</option>
                    <option value="Ciberseguridad">Ciberseguridad</option>
                    <option value="Desarrollo Software">Desarrollo de Software</option>
                    <option value="Redes Telecom">Redes y Telecomunicaciones</option>
                </select>
            </div>

            <input type="hidden" id="chat" name="chat" />

            <button type="submit" class="btn-submit">Enviar Solicitud</button>
        </form>

        <div id="exito" class="status-message success">
            <strong>¡Éxito!</strong> Tu información ha sido enviada.
        </div>

        <div id="error" class="status-message error">
            <strong>Error.</strong> Intenta de nuevo más tarde.
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('chat').value = params.get('chatId') || '';
        
        const myForm = document.getElementById('myForm');
        myForm.addEventListener('submit', async(e) => {
            e.preventDefault();
            const formData = new FormData(myForm);
            try {
                const response = await fetch('https://gradient-subsidize-unflawed.ngrok-free.dev/workflow/7VHWjPngsgy9HrbO', {
                    method: 'POST',
                    body: formData
                });
                window.location.href = '#exito';
            } catch(e) {
                window.location.href = '#error';
            }
        });
    </script>
</body>
</html>
